name: daily-posts

# GitHub drops scheduled runs under load, so each job asks the daemon for every
# slot that is due rather than assuming this run owns exactly one of them.
on:
  schedule:
    - cron: '0 23 * * *'   # 08:00 JST
    - cron: '0 3 * * *'    # 12:00 JST
    - cron: '0 9 * * *'    # 18:00 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build assets without advancing series state'
        type: boolean
        default: false

concurrency:
  group: mbti-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      # Slot times in daemon.py are wall-clock; runners are UTC without this.
      TZ: Asia/Tokyo
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5-mini
      DAILY_POSTS: '3'
      TOPIC_DEPTH: deep
      PHONE_EXPORT_DIR: delivery/phone
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Japanese fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Install package
        run: pip install --quiet -e .

      - name: Generate every due slot
        run: |
          python -m mbti_tiktok_bot run-daemon --run-once \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Show what was produced
        run: |
          find delivery/phone -name 'slide_*' -printf '%p\t%s\n' | sort || true

      - name: Commit series state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  'mbti-bot'
          git config user.email 'mbti-bot@users.noreply.github.com'
          git add state/series_state.json state/phone_export_daemon_state.json
          git diff --cached --quiet && echo 'state unchanged' && exit 0
          git commit -m "chore: advance series state [skip ci]"
          # Another slot may have landed while this job ran.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload slides
        uses: actions/upload-artifact@v4
        with:
          name: slides-${{ github.run_id }}
          path: delivery/phone
          if-no-files-found: warn
          retention-days: 14
