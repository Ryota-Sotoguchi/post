name: Post to TikTok drafts

# Hourly from 08:00 to 22:00 JST (times below are UTC).
#
# GitHub delivers scheduled runs on a best-effort basis and drops them under
# load — a half-hourly schedule here produced four runs in a day, at times
# unrelated to the ones asked for. So a run must not assume it is one of many:
# each one fills the inbox as far as the six-draft cap and the day's quota
# allow, which reaches ten a day even when most firings never happen.
#
# A carousel blocked by a full inbox is never passed over; it stays at the head
# of the queue for whichever run comes next.
on:
  schedule:
    - cron: "0 23 * * *"     # 08:00 JST
    - cron: "0 0-13 * * *"   # 09:00 .. 22:00 JST
  workflow_dispatch:
    inputs:
      count:
        description: How many carousels to send
        default: "10"
      dry_run:
        description: Print what would be sent without calling TikTok
        type: boolean
        default: false

concurrency:
  group: tiktok-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -e .

      # TIKTOK_ACCESS_TOKEN is refreshed by `daily --sync-secret` from a machine
      # with a browser. The sandbox refuses grant_type=refresh_token, so this
      # job cannot renew the credential itself; when the 24 hours run out the
      # step fails loudly, which is the signal to run `daily` again.
      - name: Send the next carousel
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          # .env is not in the repo, so the day's quota has to be stated here;
          # without it the default of 5 would silently halve the schedule.
          POSTS_PER_DAY: "10"
        run: |
          python -m tiktok_poster post \
            --count "${{ inputs.count || 10 }}" \
            ${{ inputs.dry_run == true && '--dry-run' || '' }} \
            --no-push

      - name: Record what was sent
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add state/posted.json
          git diff --cached --quiet && exit 0
          git commit -m "state: sent via Actions"
          git push
