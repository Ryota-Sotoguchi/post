name: Post to TikTok drafts

# Ten slots a day, last at 22:00 JST (times below are UTC).
#
# Only six drafts may sit unpublished at once, so a slot that finds the inbox
# full stops without sending and without failing — the carousel stays queued
# and the next slot picks it up once something has been published. Spreading
# the day this way is what lets ten through a cap of six.
on:
  schedule:
    - cron: "0 23 * * *"   # 08:00 JST
    - cron: "30 0 * * *"   # 09:30
    - cron: "0 2 * * *"    # 11:00
    - cron: "30 3 * * *"   # 12:30
    - cron: "0 5 * * *"    # 14:00
    - cron: "30 6 * * *"   # 15:30
    - cron: "0 8 * * *"    # 17:00
    - cron: "30 9 * * *"   # 18:30
    - cron: "0 11 * * *"   # 20:00
    - cron: "0 13 * * *"   # 22:00
  workflow_dispatch:
    inputs:
      count:
        description: How many carousels to send
        default: "1"
      dry_run:
        description: Print what would be sent without calling TikTok
        type: boolean
        default: false

concurrency:
  group: tiktok-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -e .

      # TIKTOK_ACCESS_TOKEN is refreshed by `daily --sync-secret` from a machine
      # with a browser. The sandbox refuses grant_type=refresh_token, so this
      # job cannot renew the credential itself; when the 24 hours run out the
      # step fails loudly, which is the signal to run `daily` again.
      - name: Send the next carousel
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          python -m tiktok_poster post \
            --count "${{ inputs.count || 1 }}" \
            ${{ inputs.dry_run == true && '--dry-run' || '' }} \
            --no-push

      - name: Record what was sent
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add state/posted.json
          git diff --cached --quiet && exit 0
          git commit -m "state: sent via Actions"
          git push
