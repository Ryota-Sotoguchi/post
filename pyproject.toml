[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mbti-tiktok-bot"
version = "0.1.0"
description = "Daily MBTI image asset pipeline with local phone export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0.1,<2",
  "Pillow>=11.1.0,<12",
  "requests>=2.32.0,<3",
]

[project.scripts]
mbti-bot = "mbti_tiktok_bot.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
